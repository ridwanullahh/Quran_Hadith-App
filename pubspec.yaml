name: minhaajulhudaa
version: 0.1.0+1
description: A premium, fully offline Qur'an and Hadith application built with Flutter.
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.11

  # Routing
  go_router: ^13.1.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio
  just_audio: ^0.9.37
  audio_service: ^0.18.13
  audio_session: ^0.1.18

  # Network (for audio download only)
  dio: ^5.4.1

  # UI
  flutter_animate: ^4.4.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  share_plus: ^7.2.2
  file_picker: ^6.1.1
  rxdart: ^0.27.7

  # Arabic text
  arabic_numbers: ^1.0.0

  # Markdown (for tafseer rendering)
  flutter_markdown: ^0.6.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0A1628"
  image: assets/images/splash.png
  android: true
  ios: false
  android_gravity: center
