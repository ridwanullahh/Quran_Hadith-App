name: minhaajulhudaa
version: 0.0.1+1
description: A premium, fully offline Qur'an and Hadith application built with Flutter.
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.11

  # Routing
  go_router: ^13.1.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Audio
  just_audio: ^0.9.37
  audio_service: ^0.18.15
  # audio_session is a transitive dependency of just_audio; we don't
  # import it directly in lib/, so we don't list it explicitly here.

  # Network (for audio download only)
  dio: ^5.4.1

  # UI
  flutter_animate: ^4.4.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0

  # Utilities
  intl: ^0.19.0
  share_plus: ^7.2.2
  file_picker: ^6.1.1
  rxdart: ^0.27.7

  # Arabic text
  arabic_numbers: ^1.0.0

  # Permissions
  permission_handler: ^11.3.0

  # Geo / location (for GPS-based prayer times + Qibla)
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Compass (for live Qibla bearing)
  flutter_compass: ^0.8.0

  # App version (for in-app update check)
  package_info_plus: ^8.0.0

  # APK install intent (for in-app self-update)
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0A1628"
  image: assets/images/splash.png
  android: true
  ios: false
  android_gravity: center
