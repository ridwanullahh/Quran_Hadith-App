org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# Disable R8 full mode: AGP 8+ enables it by default, which treats missing
# class references (e.g. Play Core split-install that this app does not use)
# as build errors. ProGuard-compatibility mode is more lenient.
android.enableR8.fullMode=false
