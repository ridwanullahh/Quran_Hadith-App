name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias minhaajulhudaa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass minhaajulhudaa123 \
            -keypass minhaajulhudaa123 \
            -dname "CN=Minhaajulhudaa, OU=Dev, O=Minhaajulhudaa, L=Lagos, C=NG"

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=minhaajulhudaa123
          keyPassword=minhaajulhudaa123
          keyAlias=minhaajulhudaa
          storeFile=release.keystore
          EOF

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=${{ steps.version.outputs.version }}
        timeout-minutes: 20

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Minhaajulhudaa v${{ steps.version.outputs.version }}"
          files: |
            build/app/outputs/flutter-apk/*.apk
          token: ${{ secrets.PAT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
