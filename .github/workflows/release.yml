name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get
        timeout-minutes: 5

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias minhaajulhudaa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass minhaajulhudaa123 \
            -keypass minhaajulhudaa123 \
            -dname "CN=Minhaajulhudaa, OU=Dev, O=Minhaajulhudaa, L=Lagos, C=NG"

      - name: Create key.properties
        run: |
          cat > android/key.properties << 'EOF'
          storePassword=minhaajulhudaa123
          keyPassword=minhaajulhudaa123
          keyAlias=minhaajulhudaa
          storeFile=release.keystore
          EOF

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.1"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=${{ steps.version.outputs.version }}
        timeout-minutes: 30

      - name: List APK outputs
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Minhaajulhudaa v${{ steps.version.outputs.version }}"
          body: |
            ## Minhaajulhudaa v${{ steps.version.outputs.version }}

            ### What's New
            - 10 new Qur'an features (Juz navigation, tafseer, surah info, progress tracker, bookmark folders, etc.)
            - 10 new Hadith features (search, notes, glossary, isnad visualizer, study planner, etc.)
            - Rich full-screen audio player with sleep timer, speed control, gesture controls
            - Audio download manager and queue management
            - Periodic in-app Qur'an & Hadith popup overlay
            - Onboarding with real permission handling (revisitable from settings)
            - In-app auto-update system
            - Hadith study tools: comparison, statistics, chain narrators, collections overview
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/*.apk
          token: ${{ secrets.PAT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
